name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Run core smoke tests
        shell: pwsh
        run: |
          python tests/zscore_smoke_test.py
          python tests/instant_smoke_test.py
          python tests/building_outlier_smoke_test.py

      - name: Build one-file and one-folder packages
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "LJQCApp-Windows-x64"
          ./packaging/build_windows_demo.ps1 `
            -OutputRoot $outputRoot `
            -PythonExe (Get-Command python.exe).Source
          "BUILD_OUTPUT_ROOT=$outputRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify Windows executables
        shell: pwsh
        run: |
          $singleExe = Join-Path $env:BUILD_OUTPUT_ROOT "release\LJQCApp.exe"
          $folderExe = Join-Path $env:BUILD_OUTPUT_ROOT "dist\LJQCApp\LJQCApp.exe"
          foreach ($exe in @($singleExe, $folderExe)) {
            if (-not (Test-Path -LiteralPath $exe)) {
              throw "Expected executable not found: $exe"
            }
            $header = [System.IO.File]::ReadAllBytes($exe)[0..1]
            if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
              throw "Not a valid Windows PE executable: $exe"
            }
            Get-Item -LiteralPath $exe | Format-List FullName, Length, LastWriteTime
          }

      - name: Launch Windows desktop packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testLocalAppData = Join-Path $env:RUNNER_TEMP "LJQCAppLocalAppData"
          $env:LOCALAPPDATA = $testLocalAppData
          $logDirectory = Join-Path $testLocalAppData "LJQCApp"
          New-Item -ItemType Directory -Path $logDirectory -Force | Out-Null

          function Test-LJQCAppLauncher {
            param(
              [string]$ExecutablePath,
              [string]$PackageName
            )

            Remove-Item -LiteralPath (Join-Path $logDirectory "desktop_launcher.log") -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $logDirectory "launcher.log") -Force -ErrorAction SilentlyContinue

            Write-Host "Starting $PackageName from $ExecutablePath"
            $process = Start-Process `
              -FilePath $ExecutablePath `
              -ArgumentList "--auto-close-seconds", "15" `
              -PassThru

            if (-not $process.WaitForExit(180000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "$PackageName did not finish its startup smoke test within 180 seconds."
            }

            if ($process.ExitCode -ne 0) {
              throw "$PackageName exited with code $($process.ExitCode)."
            }

            $desktopLogPath = Join-Path $logDirectory "desktop_launcher.log"
            $serviceLogPath = Join-Path $logDirectory "launcher.log"
            if (Test-Path -LiteralPath $desktopLogPath) {
              Write-Host "===== $PackageName desktop_launcher.log ====="
              Get-Content -LiteralPath $desktopLogPath
            }
            if (Test-Path -LiteralPath $serviceLogPath) {
              Write-Host "===== $PackageName launcher.log ====="
              Get-Content -LiteralPath $serviceLogPath
            }

            if (-not (Test-Path -LiteralPath $desktopLogPath)) {
              throw "$PackageName did not create desktop_launcher.log."
            }

            $desktopLog = Get-Content -LiteralPath $desktopLogPath -Raw
            if ($desktopLog -notmatch "Service became healthy") {
              throw "$PackageName never reported a healthy local service."
            }
            if ($desktopLog -notmatch "WebView attached") {
              throw "$PackageName never attached the desktop WebView."
            }
          }

          Test-LJQCAppLauncher `
            -ExecutablePath (Join-Path $env:BUILD_OUTPUT_ROOT "release\LJQCApp.exe") `
            -PackageName "single-file package"
          Test-LJQCAppLauncher `
            -ExecutablePath (Join-Path $env:BUILD_OUTPUT_ROOT "dist\LJQCApp\LJQCApp.exe") `
            -PackageName "folder package"

      - name: Upload startup diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LJQCApp-startup-diagnostics
          path: ${{ runner.temp }}\LJQCAppLocalAppData\LJQCApp\*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare downloadable packages
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP "artifacts"
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          Copy-Item `
            -LiteralPath (Join-Path $env:BUILD_OUTPUT_ROOT "release\LJQCApp.exe") `
            -Destination (Join-Path $artifactRoot "LJQCApp-Windows-x64.exe")
          Compress-Archive `
            -Path (Join-Path $env:BUILD_OUTPUT_ROOT "dist\LJQCApp\*") `
            -DestinationPath (Join-Path $artifactRoot "LJQCApp-Windows-x64-folder.zip") `
            -CompressionLevel Optimal
          "ARTIFACT_ROOT=$artifactRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: LJQCApp-Windows-x64
          path: |
            ${{ env.ARTIFACT_ROOT }}\LJQCApp-Windows-x64.exe
            ${{ env.ARTIFACT_ROOT }}\LJQCApp-Windows-x64-folder.zip
          if-no-files-found: error
          retention-days: 14
